<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    overflow: hidden;
    background: #fffcea;
    font-family: 'Onest', sans-serif;
    color: #0b0b0b;
  }
  .glow-top {
    position: absolute; top: 0; left: 0; right: 0; height: 14px;
    background: linear-gradient(90deg, transparent 0%, #f6e458 30%, #f6e458 55%, transparent 80%);
    opacity: 0.85;
  }
  .mascot { position: absolute; left: 96px; top: 92px; width: 266px; }
  .shadow {
    position: absolute; left: 118px; top: 432px; width: 230px; height: 26px;
    border-radius: 50%; background: rgba(95, 95, 130, 0.12);
  }
  .content { position: absolute; left: 456px; top: 118px; right: 72px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .mark {
    width: 64px; height: 64px; border-radius: 14px; background: #f6e458;
    display: grid; place-items: center;
  }
  .pill {
    margin-left: 6px; padding: 2px 16px 6px; border: 3px solid #0b0b0b; border-radius: 14px;
    font-size: 38px; font-weight: 500; letter-spacing: -0.5px; line-height: 1.1;
  }
  h1 {
    margin-top: 44px; font-size: 64px; line-height: 1.12; font-weight: 700; letter-spacing: -1.6px;
  }
  .meta { margin-top: 32px; font-size: 28px; font-weight: 600; letter-spacing: -0.3px; }
  .meta span { margin: 0 10px; }
  .track {
    position: absolute; left: 0; right: 0; top: 557px; height: 14px;
    background: linear-gradient(90deg, transparent 0%, #faf0a8 12%, #faf0a8 88%, transparent 100%);
  }
  .tiles {
    position: absolute; left: 154px; right: 154px; top: 528px;
    display: flex; justify-content: space-between;
  }
  .tile {
    width: 62px; height: 62px; border-radius: 10px; background: #f6e458;
    display: grid; place-items: center; overflow: hidden;
  }
  .swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 34px; height: 34px; }
  .swatches i { border-radius: 3px; }
  .aa { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .radius { width: 30px; height: 30px; border: 4px solid #0b0b0b; border-top-left-radius: 14px; border-right: 0; border-bottom: 0; transform: translate(4px, 4px); }
  .space { display: flex; align-items: end; gap: 4px; height: 30px; }
  .space i { width: 6px; background: #0b0b0b; border-radius: 2px; }
  .shadow-tile { width: 30px; height: 26px; border-radius: 6px; background: #fff; box-shadow: 4px 4px 0 #0b0b0b; border: 3px solid #0b0b0b; }
  .search { width: 34px; height: 34px; }
  .code { font-family: 'Geist Mono', monospace; font-size: 20px; font-weight: 500; }
</style>
