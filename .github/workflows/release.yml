name: Publish

on:
  workflow_dispatch:
  push:
    paths:
      - '.changeset/**'
      - 'packages/**'
    branches:
      - v1

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags and the Version Packages PR
      pull-requests: write # open the Version Packages PR
      id-token: write # OIDC handshake with npm (trusted publishing)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Build packages
        run: pnpm build

      - name: Publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: Version Packages (v1)
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          NPM_CONFIG_PROVENANCE: true

      - name: Slack Notification
        if: steps.changesets.outputs.published == 'true'
        uses: slackapi/slack-github-action@v2
        with:
          webhook-type: webhook-trigger
          payload: |
            {
              "package_name": "@pandacss/dev",
              "changelog_url": "https://github.com/chakra-ui/panda/blob/v1/CHANGELOG.md"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      # `--tag v1` keeps 2.x on `latest`, but packages with no 2.x release need `latest` moved to the new 1.x.
      - name: Move latest for packages without a 2.x release
        if: steps.changesets.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          if [[ -z "$PUBLISHED_PACKAGES" || "$PUBLISHED_PACKAGES" == "[]" ]]; then
            PUBLISHED_PACKAGES=$(pnpm -r ls --depth -1 --json | jq -c '[.[] | select(.private != true and (.name | startswith("@pandacss/"))) | {name, version}]')
          fi
          echo "$PUBLISHED_PACKAGES" | jq -c '.[]' | while read -r pkg; do
            name=$(jq -r .name <<< "$pkg")
            version=$(jq -r .version <<< "$pkg")
            latest=$(npm view "$name" dist-tags.latest 2>/dev/null || true)
            [[ "$latest" == 1.* && "$version" != *-* ]] || continue
            [[ "$(printf '%s\n' "$latest" "$version" | sort -V | tail -1)" == "$version" && "$latest" != "$version" ]] || continue
            for attempt in 1 2 3; do
              npm dist-tag add "$name@$version" latest && break
              [[ $attempt == 3 ]] && exit 1
              sleep 15
            done
          done
