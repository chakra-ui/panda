name: Benchmarks

on:
  pull_request:
    branches:
      - main
      - v2
    paths:
      - '.github/workflows/benchmarks.yml'
      - 'bench/**'
      - 'crates/**'
      - 'packages/compiler/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    name: Compiler perf and size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/composite-actions/install
        with:
          ignore-scripts: 'true'

      - name: Setup Rust
        uses: ./.github/composite-actions/setup-rust
        with:
          cache-key: bench

      - name: Benchmark base
        run: |
          git checkout -f ${{ github.event.pull_request.base.sha }}
          pnpm install --ignore-scripts
          pnpm --filter "@pandacss/compiler..." build
          if pnpm --filter=./bench ci-run -- --out "$RUNNER_TEMP/base.json" --files 200 --runs 9; then
            echo "benchmarked base"
          else
            echo '{}' > "$RUNNER_TEMP/base.json"
            echo "bench script missing on base, using empty result"
          fi

      - name: Benchmark head
        run: |
          git checkout -f ${{ github.event.pull_request.head.sha }}
          pnpm install --ignore-scripts
          pnpm --filter "@pandacss/compiler..." build
          pnpm --filter=./bench ci-run -- --out "$RUNNER_TEMP/head.json" --files 200 --runs 9

      - name: Compare
        id: compare
        run: |
          {
            echo 'table<<EOF'
            pnpm --filter=./bench ci-compare -- "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Save comment payload
        env:
          TABLE: ${{ steps.compare.outputs.table }}
        run: |
          mkdir -p "$RUNNER_TEMP/bench-comment"
          printf '%s' "$TABLE" > "$RUNNER_TEMP/bench-comment/table.md"

      - name: Upload comment payload
        uses: actions/upload-artifact@v4
        with:
          name: bench-comment
          path: ${{ runner.temp }}/bench-comment
